<script>
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA'),uid=()=>crypto.randomUUID(),money=n=>'₹'+(Number(n)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const initial=()=>({format:'mt-calvary-html',version:1,settings:{name:'Mt. Calvary English High School',address:'Ebenezer, Leimakhong, Manipur',phone:'',session:'2026–2027',logo:'',threshold:75},students:[],classes:['Nursery','LKG','UKG','I','II','III','IV','V','VI','VII','VIII','IX','X'],charges:[],payments:[],attendance:[],marks:[],lastBackup:''});
let state,db,page='Dashboard',query='',classFilter='',statusFilter='',pageNo=1,pageSize=25;
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',4500)}
async function start(){try{db=await new Promise((res,rej)=>{let r=indexedDB.open('MtCalvaryStudentManagerHTML',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});state=await new Promise((res,rej)=>{let r=db.transaction('data').objectStore('data').get('school');r.onsuccess=()=>res(r.result||initial());r.onerror=()=>rej(r.error)});render()}catch(e){$('#view').innerHTML='<div class="notice">Browser storage is unavailable. Open this file in a normal Chrome or Edge window, not private browsing.</div>'}}
async function save(next){await new Promise((res,rej)=>{let t=db.transaction('data','readwrite');t.objectStore('data').put(next,'school');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});state=next}
async function change(fn){let n=structuredClone(state);fn(n);await save(n)}
function go(p){if(document.querySelector('#examMarksForm')&&dirtyMarks()&&!confirm('Leave without saving the entered marks?'))return;page=p;query='';classFilter='';statusFilter='';pageNo=1;render()}
function opts(arr,v){return arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}
function field(k,label,value='',type='text',required=false){return `<label>${label}<input name="${k}" type="${type}" value="${esc(value)}" ${required?'required':''} maxlength="${k==='name'?100:250}"></label>`}
function select(k,label,arr,v){return `<label>${label}<select name="${k}">${opts(arr,v)}</select></label>`}
function openForm(title,html,submit){$('#modal').innerHTML=`<h2>${title}</h2><form><div class="grid">${html}</div><div id="formError" role="alert" class="full"></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>Save</button></div></form>`;$('#modal').showModal();$('#modal form').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{await submit(new FormData(e.target));closeModal();render();toast('Saved successfully')}catch(err){$('#formError').textContent=err.message}finally{b.disabled=false}}}
function closeModal(){$('#modal').close()}
async function imageData(file,old){if(!file?.size)return old||'';if(file.size>5*1024*1024)throw Error('Image must be below 5 MB.');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Use JPG, PNG or WEBP images.');let src=URL.createObjectURL(file);try{let img=await new Promise((res,rej)=>{let i=new Image;i.onload=()=>res(i);i.onerror=()=>rej(Error('Invalid image'));i.src=src});let c=document.createElement('canvas'),scale=Math.min(1,500/img.width,500/img.height);c.width=img.width*scale;c.height=img.height*scale;let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}finally{URL.revokeObjectURL(src)}}
function filtered(){let q=query.toLowerCase();return state.students.filter(s=>(!classFilter||s.class===classFilter)&&(!statusFilter||s.status===statusFilter)&&[s.name,s.admission,s.guardian,s.phone,s.studentId].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name))}
function student(id){return state.students.find(s=>s.id===id)}
function balance(id){return state.charges.filter(x=>x.student===id).reduce((t,x)=>t+x.amount,0)-state.payments.filter(x=>x.student===id).reduce((t,x)=>t+x.amount,0)}
function render(){upgradeData(state);let s=state.settings;$('#sideBrand').innerHTML=`${s.logo?`<img class="brandimg" src="${s.logo}" alt="School logo">`:''}<h2>${esc(s.name)}</h2>`;$('#sessionLabel').textContent=s.session+' • '+s.address;$('#title').textContent=page;$('#nav').innerHTML=['Dashboard','Students','Classes','Attendance','Fees & Receipts','Fee Settings','Subject Settings','Examinations','Bulk ID Cards','Hostel','Legacy Marks','Settings & Backup','Help'].map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('');({Dashboard:dashboard,Students:students,Classes:classes,Attendance:attendance,'Fees & Receipts':fees,'Fee Settings':feeSettings,'Subject Settings':subjectSettings,Examinations:examsView,'Bulk ID Cards':bulkIDs,Hostel:hostelView,'Legacy Marks':marks,'Settings & Backup':settings,Help:help}[page])()}
function dashboard(){let active=state.students.filter(s=>s.status==='Active').length,received=state.payments.reduce((t,p)=>t+p.amount,0),due=state.students.reduce((t,s)=>t+balance(s.id),0);$('#view').innerHTML=`<div class="grid">${[['Active students',active],['Classes',state.classes.length],['Fees collected',money(received)],['Outstanding',money(due)]].map(([l,v])=>`<div class="panel"><div class="muted">${l}</div><div class="stat">${v}</div></div>`).join('')}</div><div class="panel"><div class="bar"><div><h2>School records, in one place</h2><p class="muted">Manage admissions, family contacts, photographs and student records.</p></div><button onclick="editStudent()">+ Add student</button></div><div class="toolbar"><button class="secondary" onclick="go('Students')">Open student register</button><button class="secondary" onclick="go('Fees & Receipts')">Record a payment</button></div></div><div class="notice">${state.lastBackup?'Last backup requested: '+esc(state.lastBackup):'No backup downloaded yet.'} Download backups regularly. Clearing browser data can erase these records.</div><div class="panel"><h2>Recent admissions</h2>${studentTable([...state.students].reverse().slice(0,5))}</div>`}
function studentTable(rows){if(!rows.length)return '<div class="empty">No students found. Add a student to begin.</div>';return `<div class="scroll"><table><thead><tr><th>Admission</th><th>Student</th><th>Class / Section</th><th>Guardian / Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.admission)}</td><td>${s.photo?`<img class="avatar" src="${s.photo}" alt=""> `:''}${esc(s.name)}</td><td>${esc(s.class)} / ${esc(s.section)}</td><td>${esc(s.guardian)}<br>${esc(s.phone)}</td><td><span class="tag">${esc(s.status)}</span></td><td><button onclick="profile('${s.id}')">View</button><button class="secondary" onclick="editStudent('${s.id}')">Edit</button><button class="secondary" onclick="cards(['${s.id}'])">ID card</button><button class="danger" onclick="deleteStudent('${s.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function students(){let rows=filtered(),total=Math.max(1,Math.ceil(rows.length/pageSize));pageNo=Math.min(pageNo,total);$('#view').innerHTML=`<div class="panel"><div class="bar"><h2>Student register <small class="muted">(${rows.length})</small></h2><button onclick="editStudent()">+ Add student</button></div><div class="toolbar"><input id="search" placeholder="Search name, admission, guardian, phone…" value="${esc(query)}"><select id="classFilter"><option value="">All classes</option>${opts(state.classes,classFilter)}</select><select id="statusFilter"><option value="">All statuses</option>${opts(['Active','Inactive','Transferred','Graduated','Withdrawn'],statusFilter)}</select></div><div class="toolbar"><button class="secondary" onclick="printRegister()">Print register</button><button class="secondary" onclick="cards(filtered().map(s=>s.id))">Print filtered ID cards</button><button class="secondary" onclick="exportCSV()">Export CSV</button></div>${studentTable(rows.slice((pageNo-1)*pageSize,pageNo*pageSize))}<div class="bar" style="margin-top:18px"><span>Page ${pageNo} of ${total}</span><div><button class="secondary" ${pageNo===1?'disabled':''} onclick="pageNo--;students()">Previous</button> <button class="secondary" ${pageNo===total?'disabled':''} onclick="pageNo++;students()">Next</button></div><label>Rows<select onchange="pageSize=Number(this.value);pageNo=1;students()">${opts(['25','50','100'],String(pageSize))}</select></label></div></div>`;$('#search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;pageNo=1;students();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#classFilter').onchange=e=>{classFilter=e.target.value;pageNo=1;students()};$('#statusFilter').onchange=e=>{statusFilter=e.target.value;pageNo=1;students()}}
function editStudent(id){let s=student(id)||{admission:'MCEHS'+String(Math.max(0,...state.students.map(s=>Number(s.admission.replace(/^MCEHS/,''))||0))+1).padStart(5,'0'),status:'Active',admissionDate:today(),session:state.settings.session};openForm(id?'Edit student':'Add student',field('admission','Admission number *',s.admission,'text',true)+field('studentId','Student ID',s.studentId)+field('name','Full name *',s.name,'text',true)+select('gender','Gender',['Not specified','Male','Female','Other'],s.gender)+field('dob','Date of birth',s.dob,'date')+field('blood','Blood group',s.blood)+select('class','Class',state.classes,s.class)+field('section','Section',s.section||'A')+field('roll','Roll number',s.roll)+field('session','Academic session',s.session)+field('admissionDate','Admission date',s.admissionDate,'date')+select('status','Status',['Active','Inactive','Transferred','Graduated','Withdrawn'],s.status)+field('guardian','Parent / guardian',s.guardian)+field('mother','Mother’s name',s.mother)+field('phone','Guardian / emergency phone',s.phone,'tel')+field('email','Email',s.email,'email')+`<label class="full">Address<textarea name="address" maxlength="1000">${esc(s.address)}</textarea></label><label>Profile photo<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"><small>JPG / PNG / WEBP, up to 5 MB; automatically compressed.</small></label><label>Remove existing photo<input name="removePhoto" type="checkbox" style="width:auto"></label><label class="full">Remarks<textarea name="remarks" maxlength="2000">${esc(s.remarks)}</textarea></label>`,async f=>{let v=Object.fromEntries(f);delete v.photo;delete v.removePhoto;Object.keys(v).forEach(k=>v[k]=v[k].trim());if(!v.name||!v.admission)throw Error('Name and admission number are required.');if(state.students.some(x=>x.id!==id&&x.admission.toLowerCase()===v.admission.toLowerCase()))throw Error('Admission number already exists.');if(v.studentId&&state.students.some(x=>x.id!==id&&x.studentId===v.studentId))throw Error('Student ID already exists.');if(v.dob&&v.dob>today())throw Error('Date of birth cannot be in the future.');v.photo=await imageData(f.get('photo'),f.has('removePhoto')?'':s.photo);v.id=id||uid();await change(n=>{let i=n.students.findIndex(x=>x.id===id);i<0?n.students.push(v):n.students[i]=v})})}
async function deleteStudent(id){if(state.charges.some(x=>x.student===id)||state.payments.some(x=>x.student===id)){toast('This student has financial records. Change status to Inactive instead.');return}if(!confirm('Delete this student and their attendance/marks? This cannot be undone without a backup.'))return;try{await change(n=>{n.students=n.students.filter(s=>s.id!==id);n.attendance=n.attendance.filter(s=>s.student!==id);n.marks=n.marks.filter(s=>s.student!==id)});render()}catch(e){toast(e.message)}}

function download(name,text,type='application/json'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function exportCSV(){let keys=['admission','studentId','name','class','section','roll','session','gender','dob','guardian','mother','phone','email','address','status'];let cell=x=>'"'+(/^[=+@\-\t\r]/.test(String(x??''))?"'":'')+String(x??'').replace(/"/g,'""')+'"';download('Student_Register.csv','\ufeff'+[keys,...filtered().map(s=>keys.map(k=>s[k]))].map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function classes(){$('#view').innerHTML=`<div class="panel"><h2>Manage classes</h2><p>Class changes apply to linked students.</p><div class="toolbar"><input id="newClass" placeholder="New class name"><button onclick="addClass()">Add class</button></div><table>${state.classes.map((c,i)=>`<tr><td>${esc(c)}</td><td>${state.students.filter(s=>s.class===c).length} students</td><td><button class="secondary" onclick="renameClass(${i})">Rename</button><button class="danger" onclick="removeClass(${i})">Delete</button></td></tr>`).join('')}</table></div>`}
async function addClass(){let c=$('#newClass').value.trim();if(!c||state.classes.some(x=>x.toLowerCase()===c.toLowerCase()))return toast('Enter a unique class name.');await change(n=>n.classes.push(c));render()}
async function renameClass(i){let old=state.classes[i],c=prompt('New class name',old)?.trim();if(!c||c===old)return;if(state.classes.some(x=>x.toLowerCase()===c.toLowerCase()))return toast('Class already exists.');await change(n=>{n.classes[i]=c;n.students.forEach(s=>{if(s.class===old)s.class=c});for(let key of ['feeSettings','classSubjects','examinations'])n[key].forEach(r=>{if(r.class===old)r.class=c})});render()}
async function removeClass(i){let c=state.classes[i];if(state.students.some(s=>s.class===c)||['feeSettings','classSubjects','examinations'].some(k=>state[k].some(r=>r.class===c)))return toast('This class has linked students, settings or examinations. Remove or move those records first.');if(confirm('Delete class '+c+'?')){await change(n=>n.classes.splice(i,1));render()}}
let attDate=today(),attClass='',attMonth=today().slice(0,7);
function attendance(){let list=state.students.filter(s=>s.status==='Active'&&(!attClass||s.class===attClass));$('#view').innerHTML=`<div class="panel"><h2>Daily attendance</h2><div class="toolbar"><input type="date" value="${attDate}" onchange="attDate=this.value;attendance()"><select onchange="attClass=this.value;attendance()"><option value="">All classes</option>${opts(state.classes,attClass)}</select></div><form id="attForm"><div class="scroll"><table><thead><tr><th>Student</th><th>Class / Section</th><th>Status</th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.class)} / ${esc(s.section)}</td><td><select name="${s.id}">${opts(['Unmarked','Present','Absent','Late','Half Day','Excused'],state.attendance.find(a=>a.student===s.id&&a.date===attDate)?.status||'Unmarked')}</select></td></tr>`).join('')}</tbody></table></div><div class="actions"><button ${!list.length?'disabled':''}>Save attendance</button></div></form></div><div class="panel"><h2>Monthly attendance report</h2><label>Month<input type="month" value="${attMonth}" onchange="attMonth=this.value;attendance()"></label><p class="muted">Recorded days are the denominator; Present/Late = 1, Half Day = 0.5, Absent = 0. Excused and unmarked days are excluded. No school calendar is inferred.</p><button onclick="attendanceReport()">Preview / print report</button></div>`;$('#attForm').onsubmit=async e=>{e.preventDefault();if(!attDate)return toast('Choose a date.');let entries=[...new FormData(e.target)];try{await change(n=>{for(let [id,status] of entries){n.attendance=n.attendance.filter(a=>!(a.student===id&&a.date===attDate));if(status!=='Unmarked')n.attendance.push({student:id,date:attDate,status})}});toast('Attendance saved')}catch(err){toast(err.message)}}}
function attendanceReport(){let rows=state.students.filter(s=>!attClass||s.class===attClass).map(s=>{let a=state.attendance.filter(a=>a.student===s.id&&a.date.startsWith(attMonth)&&a.status!=='Excused'),p=a.reduce((n,x)=>n+({Present:1,Late:1,'Half Day':.5,Absent:0}[x.status]||0),0);return `<tr><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td>${a.length}</td><td>${p}</td><td>${a.length?(p/a.length*100).toFixed(1)+'%':'—'}</td><td>${a.length&&p/a.length*100<state.settings.threshold?'Below threshold':''}</td></tr>`});preview(printHead('Attendance • '+attMonth)+`<p>Class: ${esc(attClass||'All')} · Threshold: ${state.settings.threshold}%</p><table><thead><tr><th>Student</th><th>Class</th><th>Recorded days</th><th>Present equivalent</th><th>%</th><th>Flag</th></tr></thead><tbody>${rows.join('')}</tbody></table>`)}
function fees(){$('#view').innerHTML=`<div class="panel"><div class="bar"><h2>Student fee ledger</h2><div><button onclick="feeForm(false)">+ Fee charge</button> <button onclick="feeForm(true)">+ Payment</button></div></div><p class="muted">Amounts are stored in paise. Enter the net charge after any concession. Charges and payments can be edited or deleted from Fees & Receipts.</p><div class="scroll"><table><thead><tr><th>Student</th><th>Admission</th><th>Outstanding</th><th>Ledger</th></tr></thead><tbody>${state.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.admission)}</td><td>${money(balance(s.id))}</td><td><button onclick="ledger('${s.id}')">View / print</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>Payment receipts</h2><div class="scroll"><table><tr><th>Receipt</th><th>Date</th><th>Student</th><th>Amount</th><th></th></tr>${[...state.payments].reverse().map(p=>`<tr><td>${esc(p.receipt)}</td><td>${esc(p.date)}</td><td>${esc(student(p.student)?.name)}</td><td>${money(p.amount)}</td><td><button onclick="receipt('${p.id}')">Receipt</button></td></tr>`).join('')}</table></div></div>`}
function feeForm(payment){if(!state.students.length)return toast('Add a student first.');openForm(payment?'Record payment':'Create fee charge',`<label class="full">Student<select name="student">${state.students.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.admission)}</option>`).join('')}</select></label>`+field('date','Date',today(),'date',true)+`<label>Amount (₹) *<input name="amount" type="number" min="0.01" max="10000000" step="0.01" required></label>`+field('description',payment?'Payment description':'Fee type / month','','text',true)+(payment?select('mode','Payment mode',['Cash','Bank','UPI','Cheque','Online','Other'],'Cash')+field('reference','Transaction reference'):''),async f=>{let r=Object.fromEntries(f);r.amount=Math.round(Number(r.amount)*100);if(!Number.isSafeInteger(r.amount)||r.amount<=0)throw Error('Enter a valid positive amount.');if(payment&&r.amount>balance(r.student))throw Error('Payment exceeds outstanding fees. Create the charge first.');r.id=uid();if(payment)r.receipt='MCS-'+String(state.payments.length+1).padStart(6,'0');await change(n=>n[payment?'payments':'charges'].push(r))})}
function receipt(id){let p=state.payments.find(p=>p.id===id),s=student(p.student);preview(printHead('Fee receipt')+`<h2>${esc(p.receipt)}</h2><p>Date: ${esc(p.date)}<br>Received from: ${esc(s.name)} · ${esc(s.admission)}<br>Class: ${esc(s.class)} / ${esc(s.section)}</p><table><tr><th>Description</th><th>Amount</th></tr><tr><td>${esc(p.description)}</td><td>${money(p.amount)}</td></tr></table><p>Mode: ${esc(p.mode)} · Reference: ${esc(p.reference||'—')}</p><p style="margin-top:45px">Received by: ____________________</p>`)}
function ledger(id){let s=student(id),rows=[...state.charges.filter(p=>p.student===id).map(x=>({...x,type:'Charge'})),...state.payments.filter(p=>p.student===id).map(x=>({...x,type:'Payment'}))].sort((a,b)=>a.date.localeCompare(b.date));preview(printHead('Student fee ledger')+`<h2>${esc(s.name)} · ${esc(s.admission)}</h2><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.date)}</td><td>${p.type}</td><td>${esc(p.description)}</td><td>${money(p.amount)}</td></tr>`).join('')}</tbody></table><h2>Outstanding: ${money(balance(id))}</h2>`)}
function marks(){$('#view').innerHTML=`<div class="panel"><div class="bar"><h2>Examination marks</h2><button onclick="markForm()">+ Enter marks</button></div><p class="muted">Each entry has its own exam and subject maximum/pass mark. This edition calculates totals and percentages; it does not assign grades or ranks.</p><div class="scroll"><table><tr><th>Student</th><th>Exam</th><th>Subject</th><th>Marks</th><th>Actions</th></tr>${state.marks.map(m=>`<tr><td>${esc(student(m.student)?.name)}</td><td>${esc(m.exam)}</td><td>${esc(m.subject)}</td><td>${m.score} / ${m.max}</td><td><button class="secondary" onclick="markForm('${m.id}')">Edit</button><button onclick="markReport('${m.id}')">Report</button><button class="danger" onclick="removeMark('${m.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`}
function markForm(id){if(!state.students.length)return toast('Add a student first.');let m=state.marks.find(x=>x.id===id)||{};openForm('Marks entry',`<label class="full">Student<select name="student">${state.students.map(s=>`<option value="${s.id}" ${m.student===s.id?'selected':''}>${esc(s.name)} · ${esc(s.admission)}</option>`).join('')}</select></label>`+field('exam','Exam / session *',m.exam,'text',true)+field('subject','Subject *',m.subject,'text',true)+field('score','Marks obtained *',m.score,'number',true)+field('max','Maximum marks *',m.max||100,'number',true)+field('pass','Pass marks *',m.pass??40,'number',true),async f=>{let r=Object.fromEntries(f);r.exam=r.exam.trim();r.subject=r.subject.trim();['score','max','pass'].forEach(k=>r[k]=Number(r[k]));if(!r.exam||!r.subject||r.max<=0||r.score<0||r.score>r.max||r.pass<0||r.pass>r.max)throw Error('Check exam, subject and mark ranges.');if(state.marks.some(x=>x.id!==id&&x.student===r.student&&x.exam.toLowerCase()===r.exam.toLowerCase()&&x.subject.toLowerCase()===r.subject.toLowerCase()))throw Error('Marks already exist for this student, exam and subject. Use Edit.');r.id=id||uid();await change(n=>{let i=n.marks.findIndex(x=>x.id===id);i<0?n.marks.push(r):n.marks[i]=r})})}
async function removeMark(id){if(confirm('Delete this mark?')){await change(n=>n.marks=n.marks.filter(x=>x.id!==id));render()}}
function markReport(id){let m=state.marks.find(x=>x.id===id),s=student(m.student),a=state.marks.filter(x=>x.student===m.student&&x.exam===m.exam),total=a.reduce((t,x)=>t+x.score,0),max=a.reduce((t,x)=>t+x.max,0);preview(printHead('Marks statement • '+m.exam)+`<h2>${esc(s.name)}</h2><p>${esc(s.admission)} · Class ${esc(s.class)} / ${esc(s.section)}</p><table><tr><th>Subject</th><th>Obtained</th><th>Maximum</th><th>Pass mark</th><th>Result</th></tr>${a.map(x=>`<tr><td>${esc(x.subject)}</td><td>${x.score}</td><td>${x.max}</td><td>${x.pass}</td><td>${x.score>=x.pass?'Pass':'Fail'}</td></tr>`).join('')}</table><p>Total: ${total} / ${max} · Percentage: ${(total/max*100).toFixed(2)}% · ${a.every(x=>x.score>=x.pass)?'Pass':'Fail'} (recorded subjects only)</p><p style="margin-top:50px">Class teacher: ____________________ &nbsp; Principal: ____________________</p>`)}
function settings(){let s=state.settings;$('#view').innerHTML=`<div class="panel"><h2>School settings</h2><form id="settingsForm"><div class="grid">${field('name','School name *',s.name,'text',true)}${field('session','Academic session',s.session)}${field('address','Address',s.address)}${field('recognition','Govt Recognized',s.recognition)}${field('phone','School phone',s.phone)}<label>Low attendance threshold (%)<input name="threshold" type="number" min="0" max="100" value="${s.threshold}" required></label><label>Change school logo<input type="file" name="logo" accept="image/png,image/jpeg,image/webp"></label><label>Remove logo<input type="checkbox" name="removeLogo" style="width:auto"></label></div><div class="actions"><button>Save settings</button></div></form></div><div class="panel"><h2>Login and backup</h2><button onclick="changePasswordForm()">Change username / password</button><p>Records and new backups are encrypted. Keep the password used for each backup. Automatic lock: 15 minutes of inactivity.</p><p>Backups include students, compressed photos, logo, attendance, fees and marks. Keep them in a safe folder or external drive. CSV exports do not contain photos or other modules.</p><button onclick="backup()">Download full backup</button><hr><label>Restore this application’s JSON backup<input type="file" accept=".json,application/json" id="restoreFile"></label><button style="margin-top:15px" onclick="restore()">Restore backup…</button><p class="muted">Restore replaces all current records after confirmation. PHP/MySQL SQL files cannot be imported here.</p></div>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let logo=await imageData(f.get('logo'),f.has('removeLogo')?'':s.logo);let banner=s.banner||'';await change(n=>n.settings={name:f.get('name').trim(),session:f.get('session'),address:f.get('address'),recognition:f.get('recognition').trim(),phone:f.get('phone'),threshold:Number(f.get('threshold')),logo,banner});render();toast('School settings saved')}catch(err){toast(err.message)}}}
async function backup(){try{let n=structuredClone(state);n.lastBackup=new Date().toLocaleString();download('Mt_Calvary_Backup_'+today()+'.json',JSON.stringify(n));await save(n);toast('Backup download requested. Check your Downloads folder.')}catch(e){toast(e.message)}}
function validBackup(n){if(!n||n.format!=='mt-calvary-html'||n.version!==1||!n.settings||typeof n.settings.name!=='string')throw Error('Not a supported school backup.');for(let k of ['students','classes','charges','payments','attendance','marks'])if(!Array.isArray(n[k]))throw Error('Missing backup data: '+k);const img=x=>!x||typeof x==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x);if(!img(n.settings.logo)||!Number.isFinite(n.settings.threshold)||n.settings.threshold<0||n.settings.threshold>100)throw Error('Invalid settings.');let ids=new Set,ad=new Set;for(let s of n.students){if(typeof s.id!=='string'||!/^[a-zA-Z0-9-]+$/.test(s.id)||ids.has(s.id)||typeof s.name!=='string'||!s.name||typeof s.admission!=='string'||!s.admission||ad.has(s.admission.toLowerCase())||!img(s.photo))throw Error('Invalid or duplicate student.');ids.add(s.id);ad.add(s.admission.toLowerCase());for(let [k,v] of Object.entries(s))if(typeof v!=='string')throw Error('Invalid student fields.')}if(n.classes.some(x=>typeof x!=='string'))throw Error('Invalid classes.');for(let key of ['charges','payments','attendance','marks'])for(let r of n[key]){if(!ids.has(r.student))throw Error('Backup contains an unknown student link.');if(key!=='attendance'&&(typeof r.id!=='string'||!/^[a-zA-Z0-9-]+$/.test(r.id)))throw Error('Invalid record ID.');if(['charges','payments'].includes(key)&&(!Number.isSafeInteger(r.amount)||r.amount<=0))throw Error('Invalid fee amount.');if(key==='attendance'&&(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!['Present','Absent','Late','Half Day','Excused'].includes(r.status)))throw Error('Invalid attendance.');if(key==='marks'&&(![r.score,r.max,r.pass].every(Number.isFinite)||r.max<=0||r.score<0||r.score>r.max||r.pass<0||r.pass>r.max))throw Error('Invalid marks.')}for(let k of ['address','phone','session'])if(typeof n.settings[k]!=='string')throw Error('Invalid school settings.');for(let key of ['charges','payments','marks']){let unique=new Set;for(let r of n[key]){if(unique.has(r.id))throw Error('Duplicate record ID.');unique.add(r.id);for(let k of (key==='marks'?['exam','subject']:['date','description']))if(typeof r[k]!=='string'||!r[k].trim())throw Error('Missing record field: '+k);if(key==='payments'&&(typeof r.receipt!=='string'||typeof r.mode!=='string'))throw Error('Invalid receipt.')}}return n}
async function restore(){try{let f=$('#restoreFile').files[0];if(!f)throw Error('Choose a JSON backup first.');if(f.size>100*1024*1024)throw Error('Backup exceeds 100 MB.');let n=validBackup(JSON.parse(await f.text()));if(!confirm(`Replace all current records with ${n.students.length} students from this backup? Download a current backup first if needed.`))return;await save(n);render();toast('Backup restored')}catch(e){toast('Restore failed: '+e.message)}}

function applyFeeForm(id){let r=state.feeSettings.find(x=>x.id===id);openForm('Apply '+esc(r.name)+' · '+esc(r.class),field('session','Academic session *',state.settings.session,'text',true)+(r.frequency==='Monthly'?field('period','Fee month *',today().slice(0,7),'month',true):r.frequency==='Termly'?select('period','Term',['Term 1','Term 2','Term 3','Term 4'],'Term 1'):'<p>This fee is applied once per student per academic session.</p>')+field('section','Section (blank = all)')+field('date','Charge date *',today(),'date',true)+`<p class="full">${money(r.amount)} per active student whose class and academic session match. Students already charged for this fee and period are skipped.</p>`,async f=>{let session=nonempty(f.get('session'),'Session'),period=feePeriod(r,f),section=f.get('section').trim(),date=nonempty(f.get('date'),'Date');let targets=feeTargets(state,r,session,period,section);if(!targets.length)throw Error('No eligible students. Check their session/class, or whether this period has already been charged.');if(!confirm(`Create ${targets.length} charges for ${r.name}, ${session}, ${period}?\nTotal: ${money(targets.length*r.amount)}\nThis adds permanent fee charges.`))throw Error('No charges created.');await change(n=>{for(let s of feeTargets(n,r,session,period,section))n.charges.push({id:uid(),student:s.id,date,description:r.name+' · '+session+' · '+period,amount:r.amount,feeSetting:r.id,feeSession:session,feePeriod:period})})})}

function examForm(id){let e=state.examinations.find(x=>x.id===id),locked=e&&state.examResults.some(x=>x.exam===id);if(locked)return toast('This exam contains marks. Its settings are locked to protect recorded results.');let r=e||{class:state.classes[0],session:state.settings.session,date:today()};openForm(e?'Examination settings':'Create class examination',field('name','Examination name *',r.name,'text',true)+select('class','Class',state.classes,r.class)+field('session','Academic session *',r.session,'text',true)+field('date','Examination date *',r.date,'date',true)+`<div class="full" id="examSubjects"></div>`,async f=>{let c=f.get('class'),name=nonempty(f.get('name'),'Examination name'),session=nonempty(f.get('session'),'Session');if(state.examinations.some(x=>x.id!==id&&x.class===c&&x.session===session&&x.name.toLowerCase()===name.toLowerCase()))throw Error('This class examination already exists.');let subjects=[...$('#examSubjects').querySelectorAll('[data-subject]')].filter(x=>x.querySelector('[data-include]').checked).map(x=>({id:x.dataset.subject,name:x.dataset.name,max:Number(x.querySelector('[data-max]').value),pass:Number(x.querySelector('[data-pass]').value)}));if(!subjects.length)throw Error('Select at least one subject. Add subjects under Subject Settings first.');if(subjects.some(s=>!Number.isFinite(s.max)||s.max<=0||!Number.isFinite(s.pass)||s.pass<0||s.pass>s.max))throw Error('Check subject maximum and pass marks.');let roster=state.students.filter(s=>sameSchoolText(s.class,c)&&sameSchoolText(s.session,session)&&s.status==='Active').map(s=>s.id);let v={id:id||uid(),name,class:c,session,date:f.get('date'),subjects,students:roster};await change(n=>{let i=n.examinations.findIndex(x=>x.id===id);i<0?n.examinations.push(v):n.examinations[i]=v})});function redraw(){let c=$('#modal [name=class]').value,subs=e&&e.class===c?e.subjects:state.classSubjects.filter(x=>x.class===c);$('#examSubjects').innerHTML=`<h3>Subjects and mark limits</h3>${subs.map(s=>`<div data-subject="${s.id}" data-name="${esc(s.name)}" class="subjectrow"><label><input data-include type="checkbox" checked style="width:auto"> ${esc(s.name)}</label><label>Maximum<input data-max type="number" min="0.01" max="10000" step="0.01" value="${s.max}"></label><label>Pass<input data-pass type="number" min="0" max="10000" step="0.01" value="${s.pass}"></label></div>`).join('')||'<p>No subjects configured for this class.</p>'}`};$('#modal [name=class]').onchange=redraw;redraw()}
async function deleteExam(id){if(state.examResults.some(r=>r.exam===id))return toast('An examination with saved marks cannot be deleted.');if(confirm('Delete this examination?')){await change(n=>n.examinations=n.examinations.filter(e=>e.id!==id));render()}}

function examEditor(){let e=state.examinations.find(x=>x.id===examSelected);if(!e)return examsView();let students=examRoster(e);$('#view').innerHTML=`<div class="panel"><div class="bar"><div><h2>${esc(e.name)} · Class ${esc(e.class)}</h2><p>${esc(e.session)} · ${esc(e.date)}</p></div><button class="secondary" onclick="leaveExam()">Back to examinations</button></div><div class="toolbar"><input id="examSection" placeholder="Section filter (blank = all)" value="${esc(examSection)}"><button class="secondary" onclick="setExamSection()">Filter</button><button class="secondary" onclick="addExamStudents()">Add / select students</button><button onclick="classMarkSheet()">Print class marks sheet</button><button class="secondary" onclick="exportMarkSheet()">Export marks CSV</button></div><p class="muted">Enter numbers or AB for absent. Blank = not entered. Save before printing. Incomplete results remain Pending.</p><form id="examMarksForm"><div class="scroll"><table><thead><tr><th>Roll / Student</th>${e.subjects.map(s=>`<th>${esc(s.name)}<br><small>Max ${s.max} · Pass ${s.pass}</small></th>`).join('')}<th>Report</th></tr></thead><tbody>${students.map(s=>`<tr><td>${esc(s.roll)} · ${esc(s.name)}<br><small>${esc(s.admission)}</small></td>${e.subjects.map(sub=>`<td><input aria-label="${esc(s.name+' '+sub.name)}" data-student="${s.id}" data-subject="${sub.id}" class="markinput" value="${esc(examResult(state,e.id,s.id,sub.id)?.value??'')}" inputmode="decimal" style="min-width:75px;width:85px"></td>`).join('')}<td><button type="button" onclick="studentExamSheet('${s.id}')">Report</button></td></tr>`).join('')}</tbody></table></div><div class="actions"><button ${!students.length?'disabled':''}>Save marks</button></div></form><p id="examSaveStatus"></p></div>`;$('#examMarksForm').onsubmit=async ev=>{ev.preventDefault();let b=ev.submitter;b.disabled=true;try{let entries=[...document.querySelectorAll('.markinput')].map(x=>({student:x.dataset.student,subject:x.dataset.subject,value:parseMark(x.value,e.subjects.find(s=>s.id===x.dataset.subject).max)}));await change(n=>{for(let r of entries){n.examResults=n.examResults.filter(x=>!(x.exam===e.id&&x.student===r.student&&x.subject===r.subject));if(r.value!=='')n.examResults.push({...r,exam:e.id})}});$('#examSaveStatus').textContent='Marks saved at '+new Date().toLocaleTimeString();toast('Class marks saved')}catch(err){toast(err.message)}finally{b.disabled=false}}}
function parseMark(v,max){v=String(v).trim().toUpperCase();if(v===''||v==='AB')return v;if(!/^\d+(\.\d{1,2})?$/.test(v)||!Number.isFinite(Number(v))||Number(v)<0||Number(v)>max)throw Error('Marks must be 0–'+max+', AB, or blank (up to 2 decimals).');return Number(v)}
function dirtyMarks(){return [...document.querySelectorAll('.markinput')].some(x=>String(x.value).trim().toUpperCase()!==String(examResult(state,examSelected,x.dataset.student,x.dataset.subject)?.value??''))}
function requireSavedMarks(){if(dirtyMarks()){toast('Save the entered marks before printing or changing the filter.');return false}return true}

async function addExamStudents(){if(!requireSavedMarks())return;let e=state.examinations.find(x=>x.id===examSelected),ids=state.students.filter(s=>s.class===e.class&&s.session===e.session&&s.status==='Active'&&!e.students.includes(s.id)).map(s=>s.id);if(!ids.length)return toast('No new eligible students.');if(confirm('Add '+ids.length+' active students to this examination?')){await change(n=>n.examinations.find(x=>x.id===e.id).students.push(...ids));examEditor()}}
function summarizeExam(n,e,id){let values=e.subjects.map(s=>examResult(n,e.id,id,s.id)?.value??''),total=values.reduce((t,v)=>t+(typeof v==='number'?v:0),0),maximum=e.subjects.reduce((t,s)=>t+s.max,0),complete=values.every(v=>v!==''),pass=complete&&values.every((v,i)=>typeof v==='number'&&v>=e.subjects[i].pass);return {values,total:Math.round(total*100)/100,maximum,percentage:complete?(total/maximum*100).toFixed(2):'—',result:complete?(pass?'Pass':'Fail'):'Pending'}}
function classMarkSheet(){if(!requireSavedMarks())return;let e=state.examinations.find(x=>x.id===examSelected);preview(printHead('Class marks sheet')+`<h3>${esc(e.name)} · Class ${esc(e.class)} · ${esc(e.session)}</h3><p>Exam date: ${esc(e.date)} · Section: ${esc(examSection||'All')} · AB = Absent · — = Not entered</p><div class="marksPrint"><table><thead><tr><th>Roll</th><th>Student / Admission</th>${e.subjects.map(s=>`<th>${esc(s.name)}<br>${s.max} / Pass ${s.pass}</th>`).join('')}<th>Total / ${e.subjects.reduce((t,s)=>t+s.max,0)}</th><th>%</th><th>Result</th></tr></thead><tbody>${examRoster(e).map(s=>{let r=summarizeExam(state,e,s.id);return `<tr><td>${esc(s.roll)}</td><td>${esc(s.name)}<br>${esc(s.admission)}</td>${r.values.map(v=>`<td>${v===''?'—':v}</td>`).join('')}<td>${r.total}${r.result==='Pending'?'*':''}</td><td>${r.percentage}</td><td>${r.result}</td></tr>`}).join('')}</tbody></table></div><p>* Partial total; percentage and final result withheld until every subject is entered.</p><p style="margin-top:30px">Class teacher: ____________________ &nbsp; Principal: ____________________</p><small>Developed by Hegin Haokip - 9612338375</small>`)}
function studentExamSheet(id){if(!requireSavedMarks())return;let e=state.examinations.find(x=>x.id===examSelected),s=student(id),r=summarizeExam(state,e,id);preview(printHead('Student marks sheet')+`<h2>${esc(s.name)}</h2><p>${esc(s.admission)} · Roll ${esc(s.roll)} · Class ${esc(e.class)} / ${esc(s.section)}<br>${esc(e.name)} · ${esc(e.session)} · ${esc(e.date)}</p><table><thead><tr><th>Subject</th><th>Maximum</th><th>Pass</th><th>Obtained</th></tr></thead><tbody>${e.subjects.map((sub,i)=>`<tr><td>${esc(sub.name)}</td><td>${sub.max}</td><td>${sub.pass}</td><td>${r.values[i]===''?'—':r.values[i]}</td></tr>`).join('')}</tbody></table><h3>Total: ${r.total} / ${r.maximum} · Percentage: ${r.percentage}${r.result==='Pending'?'':'%'} · ${r.result}</h3><p>${r.result==='Pending'?'Partial total. Final result awaits all subjects.':'AB = Absent (0 marks).'}</p><p style="margin-top:40px">Class teacher: ____________________ &nbsp; Principal: ____________________</p>`)}
function csvRows(rows){return '\ufeff'+rows.map(r=>r.map(x=>'"'+(/^[=+@\-\t\r]/.test(String(x??''))?"'":'')+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}

// Local encrypted vault: PBKDF2-SHA256 and AES-256-GCM.
let vaultKey=null,vaultMeta=null,vaultRevision=0,vaultSaving=false,idleTimer=null,loginFailures=0,loginRetry=0;
const b64=bytes=>{let out='';for(let b of new Uint8Array(bytes))out+=String.fromCharCode(b);return btoa(out)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveVaultKey(password,salt){let seed=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:unb64(salt),iterations:600000},seed,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function sealVault(n,key,meta,rev){let iv=crypto.getRandomValues(new Uint8Array(12));let data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(n)));return {format:'mt-calvary-encrypted',version:1,salt:meta.salt,username:meta.username,iv:b64(iv),cipher:b64(data),revision:rev,branding:{name:n.settings.name,logo:n.settings.logo||''}}}
async function openVault(v,password){if(v.format!=='mt-calvary-encrypted'||v.version!==1||typeof v.salt!=='string'||typeof v.iv!=='string'||typeof v.cipher!=='string'||unb64(v.salt).length!==16||unb64(v.iv).length!==12)throw Error('Unsupported encrypted backup.');let key=await deriveVaultKey(password,v.salt);let clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},key,unb64(v.cipher));return {key,data:JSON.parse(new TextDecoder().decode(clear))}}
function readStored(){return new Promise((res,rej)=>{let r=db.transaction('data').objectStore('data').get('school');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function commitVault(v,expected){return new Promise((res,rej)=>{let t=db.transaction('data','readwrite'),o=t.objectStore('data'),r=o.get('school'),conflict=false;r.onsuccess=()=>{let current=r.result;if((current?.format==='mt-calvary-encrypted'?current.revision:0)!==expected){conflict=true;t.abort();return}o.put(v,'school')};t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(Error(conflict?'Records changed in another tab. Log in again before saving.':'Unable to save encrypted records.'))})}
const preSecureUpgrade=upgradeData;upgradeData=function(n){preSecureUpgrade(n);if(n.settings.banner===undefined)n.settings.banner='';n.appVersion=2.3;return n};
start=async function(){document.body.classList.add('locked');try{if(!crypto.subtle)throw Error('Encryption is unavailable. Use current Chrome or Edge.');db=await new Promise((res,rej)=>{let r=indexedDB.open('MtCalvaryStudentManagerHTML',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});await showLogin()}catch(e){document.querySelector('#loginSurface').textContent=e.message}};
async function showLogin(){let stored=await readStored(),setup=stored?.format!=='mt-calvary-encrypted',branding=setup?(stored?.settings||initial().settings):(stored.branding||{});document.body.classList.add('locked');let logo=branding.logo&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(branding.logo)?branding.logo:'';$('#loginSurface').innerHTML=`<div class="loginCard">${logo?`<img class="loginLogo" src="${logo}" alt="School logo">`:'<div class="loginEmblem">MC</div>'}<h1>${esc(branding.name||'Mt. Calvary English High School')}</h1><p>${setup?'Create your local administrator login':'Sign in to school management'}</p><form id="loginForm"><label>Username<input name="username" autocomplete="username" value="${setup?'admin':''}" required maxlength="80"></label><label>Password<input name="password" type="password" autocomplete="${setup?'new-password':'current-password'}" ${setup?'minlength="12"':''} required></label>${setup?'<label>Confirm password<input name="confirm" type="password" autocomplete="new-password" minlength="12" required></label><p class="muted">Use at least 12 characters. Existing records will be encrypted after setup. Keep this password safely; there is no password reset.</p>':''}<p id="loginError" role="alert"></p><button>${setup?'Create login & encrypt records':'Log in'}</button></form><small>Your school name and logo are visible before login. Student records remain encrypted while locked.<br>Developed by Hegin Haokip - 9612338375</small></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{if(Date.now()<loginRetry)throw Error('Please wait '+Math.ceil((loginRetry-Date.now())/1000)+' seconds before trying again.');let f=new FormData(e.target),username=f.get('username').trim(),password=f.get('password');let current=await readStored();if(setup){if(current?.format==='mt-calvary-encrypted')throw Error('Login was already configured. Reload this page.');if(!username||password.length<12||password!==f.get('confirm'))throw Error('Enter a username and matching passwords of at least 12 characters.');let data=upgradeData(current||initial()),meta={salt:b64(crypto.getRandomValues(new Uint8Array(16))),username},key=await deriveVaultKey(password,meta.salt),encrypted=await sealVault(data,key,meta,1);await commitVault(encrypted,0);vaultKey=key;vaultMeta=meta;vaultRevision=1;state=data}else{try{if(username!==current.username)throw Error('Invalid');let result=await openVault(current,password);vaultKey=result.key;vaultMeta={salt:current.salt,username:current.username};vaultRevision=current.revision;state=upgradeData(result.data)}catch(err){loginFailures++;loginRetry=Date.now()+Math.min(60000,1000*2**Math.min(loginFailures,6));throw Error('Incorrect username/password, or damaged saved data.')}}loginFailures=0;$('#loginSurface').innerHTML='';document.body.classList.remove('locked');page='Dashboard';render();resetIdle()}catch(err){$('#loginError').textContent=err.message}finally{b.disabled=false}}}
save=async function(next){if(!vaultKey)throw Error('Please log in before saving.');if(vaultSaving)throw Error('A save is already in progress. Please try again.');vaultSaving=true;try{let v=await sealVault(next,vaultKey,vaultMeta,vaultRevision+1);await commitVault(v,vaultRevision);vaultRevision=v.revision;state=next;resetIdle()}finally{vaultSaving=false}};

async function bannerData(file,old){if(!file?.size)return old||'';if(file.size>8*1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Use a JPG, PNG or WEBP banner below 8 MB.');let url=URL.createObjectURL(file);try{let im=await new Promise((res,rej)=>{let x=new Image;x.onload=()=>res(x);x.onerror=()=>rej(Error('Invalid banner image'));x.src=url}),c=document.createElement('canvas'),scale=Math.min(1,1800/im.width,600/im.height);c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)}finally{URL.revokeObjectURL(url)}}

function hostelView(){let active=state.hostelStays.filter(a=>!a.checkout),beds=state.hostelRooms.reduce((t,r)=>t+r.capacity,0);$('#view').innerHTML=`<div class="grid">${[['Rooms',state.hostelRooms.length],['Total beds',beds],['Residents',active.length],['Vacant beds',beds-active.length]].map(([l,v])=>`<div class="panel"><span>${l}</span><div class="stat">${v}</div></div>`).join('')}</div><div class="panel"><div class="bar"><h2>Hostels & rooms</h2><button onclick="hostelRoomForm()">+ Add room</button></div><div class="scroll"><table><tr><th>Hostel / Room</th><th>Warden / Contact</th><th>Capacity</th><th>Occupied / Vacant</th><th>Actions</th></tr>${state.hostelRooms.map(r=>`<tr><td>${esc(r.hostel)} / ${esc(r.name)}</td><td>${esc(r.warden)}<br>${esc(r.phone)}</td><td>${r.capacity}</td><td>${occupants(r.id).length} / ${r.capacity-occupants(r.id).length}</td><td><button class="secondary" onclick="hostelRoomForm('${r.id}')">Edit</button><button class="danger" onclick="deleteHostelRoom('${r.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">Add a hostel room to begin.</td></tr>'}</table></div></div><div class="panel"><div class="bar"><h2>Student allocations</h2><div><button onclick="hostelStayForm()">+ Allocate student</button> <button class="secondary" onclick="printHostel()">Print residents</button></div></div><p class="muted">Names, admission numbers, classes and guardian contacts are linked to Students. Edit a stay to transfer rooms; check out to release a bed.</p><div class="toolbar"><input id="hostelSearch" placeholder="Search student / admission / room" oninput="hostelTable(this.value)"></div><div id="hostelTable"></div></div>`;hostelTable('')}
function hostelTable(q){q=q.toLowerCase();let rows=[...state.hostelStays].reverse().filter(a=>{let s=student(a.student),r=state.hostelRooms.find(r=>r.id===a.room);return [s.name,s.admission,s.class,r.hostel,r.name].join(' ').toLowerCase().includes(q)});$('#hostelTable').innerHTML=`<div class="scroll"><table><tr><th>Student</th><th>Hostel / Room</th><th>Guardian / Contact</th><th>Check-in / Out</th><th>Actions</th></tr>${rows.map(a=>{let s=student(a.student),r=state.hostelRooms.find(r=>r.id===a.room);return `<tr><td>${esc(s.name)}<br>${esc(s.admission)} · ${esc(s.class)} / ${esc(s.section)}</td><td>${esc(r.hostel)} / ${esc(r.name)}</td><td>${esc(s.guardian)}<br>${esc(s.phone)}</td><td>${esc(a.checkin)}<br>${esc(a.checkout||'Resident')}</td><td><button class="secondary" onclick="profile('${s.id}')">Student</button><button class="secondary" onclick="hostelStayForm('${a.id}')">Edit</button>${!a.checkout?`<button onclick="hostelCheckout('${a.id}')">Check out</button>`:''}<button class="danger" onclick="deleteHostelStay('${a.id}')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="5">No allocations found.</td></tr>'}</table></div>`}
function hostelRoomForm(id){let r=state.hostelRooms.find(x=>x.id===id)||{capacity:1};openForm(id?'Edit hostel room':'Add hostel room',field('hostel','Hostel name *',r.hostel,'text',true)+field('name','Room name / number *',r.name,'text',true)+field('capacity','Bed capacity *',r.capacity,'number',true)+field('warden','Warden',r.warden)+field('phone','Warden phone',r.phone,'tel'),async f=>{let v={id:id||uid(),hostel:nonempty(f.get('hostel'),'Hostel'),name:nonempty(f.get('name'),'Room'),capacity:Number(f.get('capacity')),warden:f.get('warden').trim(),phone:f.get('phone').trim()};if(state.hostelRooms.some(x=>x.id!==id&&sameSchoolText(x.hostel,v.hostel)&&sameSchoolText(x.name,v.name)))throw Error('Room already exists in this hostel.');await change(n=>{let i=n.hostelRooms.findIndex(x=>x.id===id);i<0?n.hostelRooms.push(v):n.hostelRooms[i]=v;validateHostel(n)})})}
function hostelStayForm(id){if(!state.students.length||!state.hostelRooms.length)return toast('Add students and hostel rooms first.');let a=state.hostelStays.find(x=>x.id===id)||{checkin:today(),checkout:''};openForm(id?'Edit allocation / transfer room':'Allocate student',`<label class="full">Student<select name="student">${idOptions(state.students,a.student,s=>s.name+' · '+s.admission+' · '+s.class)}</select></label><label class="full">Hostel / Room<select name="room">${idOptions(state.hostelRooms,a.room,r=>r.hostel+' / '+r.name+' · '+(r.capacity-occupants(r.id).length)+' vacant beds')}</select></label>`+field('checkin','Check-in date *',a.checkin,'date',true)+field('checkout','Check-out date (blank = resident)',a.checkout,'date')+field('remarks','Remarks',a.remarks),async f=>{let v={id:id||uid(),student:f.get('student'),room:f.get('room'),checkin:f.get('checkin'),checkout:f.get('checkout'),remarks:f.get('remarks').trim()};await change(n=>{let i=n.hostelStays.findIndex(x=>x.id===id);i<0?n.hostelStays.push(v):n.hostelStays[i]=v;validateHostel(n)})})}
function hostelCheckout(id){let a=state.hostelStays.find(x=>x.id===id);openForm('Check out '+esc(student(a.student).name),field('date','Check-out date *',today(),'date',true),async f=>{await change(n=>{n.hostelStays.find(x=>x.id===id).checkout=f.get('date');validateHostel(n)})})}
async function deleteHostelStay(id){if(confirm('Delete this allocation record? The student profile remains.')){await change(n=>n.hostelStays=n.hostelStays.filter(a=>a.id!==id));render()}}
async function deleteHostelRoom(id){if(state.hostelStays.some(a=>a.room===id))return toast('This room has allocation history. Keep it or remove/correct the linked allocations first.');if(confirm('Delete this room?')){await change(n=>n.hostelRooms=n.hostelRooms.filter(r=>r.id!==id));render()}}
function printHostel(){let rows=state.hostelStays.filter(a=>!a.checkout);preview(printHead('Hostel resident register')+`<p>${rows.length} residents · ${today()}</p><table><thead><tr><th>Student / Admission</th><th>Class</th><th>Hostel / Room</th><th>Check-in</th><th>Guardian / Phone</th></tr></thead><tbody>${rows.map(a=>{let s=student(a.student),r=state.hostelRooms.find(r=>r.id===a.room);return `<tr><td>${esc(s.name)}<br>${esc(s.admission)}</td><td>${esc(s.class)} / ${esc(s.section)}</td><td>${esc(r.hostel)} / ${esc(r.name)}</td><td>${esc(a.checkin)}</td><td>${esc(s.guardian)}<br>${esc(s.phone)}</td></tr>`}).join('')}</tbody></table>`)}
const preHostelDelete=deleteStudent;deleteStudent=async function(id){if(state.hostelStays.some(a=>a.student===id))return toast('This student has hostel records. Set their status to Inactive or correct the hostel records first.');await preHostelDelete(id)};
const preHostelBackup=validBackup;validBackup=function(n){preHostelBackup(n);validateHostel(n);return n};

window.addEventListener('unhandledrejection',e=>{toast('Could not complete operation: '+e.reason?.message);e.preventDefault()});start();
</script></html>
